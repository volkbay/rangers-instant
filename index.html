  :root{
    --bg:#f4eee1;
    --surface:#fffcf6;
    --surface-2:#f7f1e4;
    --stage:#e8dfcb;
    --ink:#121c26;
    --muted:#5d6672;
    --line:#e2d8c3;
    --red:#b93038;
    --red-hover:#a2272f;
    --on-red:#fff8f0;
    --blue:#17639b;
    --gold:#dca21f;
    --focus:#17639b;
    --shadow:0 1px 2px rgba(18,28,38,.06), 0 10px 30px rgba(18,28,38,.08);
    --card-shadow:0 2px 4px rgba(18,28,38,.18), 0 18px 40px rgba(18,28,38,.22);
    --radius:16px;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f151c; --surface:#16202a; --surface-2:#1b2733; --stage:#0b1016;
      --ink:#f1ebde; --muted:#9aa5b1; --line:#283543;
      --red:#d9474f; --red-hover:#e85d64; --on-red:#fff8f0;
      --blue:#4c9bd6; --gold:#e8b43c; --focus:#6fb2e6;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.25);
      --card-shadow:0 2px 6px rgba(0,0,0,.5), 0 18px 44px rgba(0,0,0,.55);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f151c; --surface:#16202a; --surface-2:#1b2733; --stage:#0b1016;
    --ink:#f1ebde; --muted:#9aa5b1; --line:#283543;
    --red:#d9474f; --red-hover:#e85d64; --on-red:#fff8f0;
    --blue:#4c9bd6; --gold:#e8b43c; --focus:#6fb2e6;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.25);
    --card-shadow:0 2px 6px rgba(0,0,0,.5), 0 18px 44px rgba(0,0,0,.55);
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size:15px;
    line-height:1.45;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  button, input, select{font:inherit; color:inherit;}
  :focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  [hidden]{display:none !important;}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

  /* ---------- Header ---------- */
  .top{
    display:flex; align-items:center; gap:16px;
    padding:12px 20px;
    max-width:1400px; margin:0 auto;
  }
  @media (min-width: 821px){
    .top{position:sticky; top:0; z-index:30; background:var(--bg); clip-path:inset(0 -100vw); box-shadow:0 0 0 100vw var(--bg); transition:padding .2s;}
    .top.scrolled{padding-top:8px; padding-bottom:8px; box-shadow:0 0 0 100vw var(--bg), inset 0 -1px 0 var(--line);}
    .top.scrolled .brand img{height:42px;}
    .top.scrolled .brand p{display:none;}
    .studio .stage-wrap{top:calc(var(--hdr, 0px) + 12px);}
  }
  .brand{display:flex; align-items:center; gap:12px; min-width:0; flex:1;}
  .brand img{height:58px; width:auto; display:block; flex:none; transition:height .2s;}
  .brand h1{
    margin:0; font-size:26px; line-height:1; font-weight:800; letter-spacing:-.02em;
    font-variation-settings:"opsz" 96;
  }
  .brand h1 span{color:var(--red);}
  .brand p{margin:4px 0 0; color:var(--muted); font-size:13px;}

  .tabs{display:flex; gap:4px; background:var(--surface); border:1px solid var(--line); padding:4px; border-radius:999px; box-shadow:var(--shadow);}
  .tab{
    display:flex; align-items:center; gap:8px;
    border:0; background:transparent; cursor:pointer;
    padding:9px 18px; border-radius:999px; font-weight:600; color:var(--muted);
    position:relative;
  }
  .tab svg{width:18px; height:18px; flex:none;}
  .tab[aria-selected="true"]{background:var(--ink); color:var(--bg);}
  .badge{
    min-width:20px; height:20px; padding:0 6px; border-radius:999px;
    background:var(--red); color:var(--on-red); font-size:12px; font-weight:700;
    display:none; align-items:center; justify-content:center; font-variant-numeric:tabular-nums;
  }
  .badge.show{display:inline-flex;}

  .lang{display:flex; gap:6px;}
  .lang button{
    width:40px; height:30px; padding:0; border-radius:8px; overflow:hidden;
    border:2px solid transparent; background:none; cursor:pointer; opacity:.55;
    transition:opacity .15s, border-color .15s, transform .15s;
  }
  .lang button svg{width:100%; height:100%; display:block;}
  .lang button[aria-pressed="true"]{opacity:1; border-color:var(--ink);}
  .lang button:hover{opacity:1;}

  main{max-width:1400px; margin:0 auto; padding:0 20px 40px;}
  .view[hidden]{display:none !important;}

  /* ---------- Studio ---------- */
  .studio{display:grid; grid-template-columns:minmax(0,1fr) 390px; gap:20px; align-items:start;}
  .stage-wrap{position:sticky; top:12px;}
  .stage{
    position:relative;
    height:calc(100vh - 184px); min-height:420px;
    background:var(--stage);
    background-image:radial-gradient(rgba(18,28,38,.07) 1px, transparent 1px);
    background-size:18px 18px;
    border-radius:var(--radius);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    border:1px solid var(--line);
  }
  #cardCanvas{
    display:none;
    box-shadow:var(--card-shadow);
    transform:rotate(-1.2deg);
    touch-action:none; cursor:grab;
    border-radius:2px;
    max-width:none;
  }
  #cardCanvas.dragging{cursor:grabbing;}
  .stage.photo-mode #cardCanvas{transform:none; cursor:default; box-shadow:0 6px 24px rgba(0,0,0,.25); border-radius:0;}
  .stage-mode{position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:2; display:none; box-shadow:var(--shadow); background:var(--surface);}
  .stage.has-photo .stage-mode{display:flex;}
  .stage-mode button{padding:7px 16px;}
  .stage.photo-mode #compareBtn{visibility:hidden;}
  .stage.photo-mode .hint-card, .stage:not(.photo-mode) .hint-photo{display:none;}
  #cardCanvas.develop{animation:develop 2.6s cubic-bezier(.2,.7,.3,1);}
  @keyframes develop{
    0%{filter:brightness(1.5) saturate(0) contrast(.35) sepia(.4);}
    35%{filter:brightness(1.25) saturate(.35) contrast(.6) sepia(.25);}
    100%{filter:none;}
  }
  .stage-tools{
    position:absolute; left:12px; right:12px; bottom:12px;
    display:none; justify-content:space-between; align-items:center; gap:8px; pointer-events:none;
  }
  .stage.has-photo .stage-tools{display:flex;}
  .chip-btn{
    pointer-events:auto;
    display:inline-flex; align-items:center; gap:6px;
    background:var(--surface); color:var(--ink);
    border:1px solid var(--line); border-radius:999px;
    padding:7px 13px; font-size:13px; font-weight:600; cursor:pointer;
    box-shadow:var(--shadow); user-select:none; -webkit-user-select:none; white-space:nowrap; flex:none;
  }
  .chip-btn svg{width:16px; height:16px;}
  .chip-btn:active{transform:translateY(1px);}
  #compareBtn{margin-left:auto;}
  .hint{pointer-events:none; font-size:12px; color:var(--muted); background:var(--surface); padding:5px 10px; border-radius:12px; white-space:pre-line; border:1px solid var(--line); opacity:.92;}
  .hint svg{width:13px; height:13px; vertical-align:-2px;}

  .empty{
    text-align:center; padding:28px; max-width:420px;
  }
  .empty .drop-ill{
    width:120px; height:140px; margin:0 auto 18px; background:#fff; border-radius:4px;
    box-shadow:var(--card-shadow); padding:9px 9px 34px; transform:rotate(-4deg);
  }
  .empty .drop-ill div{width:100%; height:100%; background:linear-gradient(160deg, var(--blue), #0d3e63); border-radius:1px; position:relative; overflow:hidden;}
  .empty .drop-ill div::after{content:""; position:absolute; right:14px; top:14px; width:20px; height:20px; border-radius:50%; background:var(--gold);}
  .empty .drop-ill div::before{content:""; position:absolute; left:-10px; right:-10px; bottom:-30px; height:60px; background:var(--red); transform:rotate(-14deg);}
  .empty h2{margin:0 0 6px; font-size:22px; font-weight:800; letter-spacing:-.01em;}
  .empty p{margin:0 0 18px; color:var(--muted);}
  .stage.drag{outline:3px dashed var(--red); outline-offset:-10px;}

  /* ---------- Panels ---------- */
  .panel{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  details.sec{border-bottom:1px solid var(--line);}
  details.sec:last-of-type{border-bottom:0;}
  details.sec > summary{
    list-style:none; cursor:pointer;
    display:flex; align-items:center; gap:10px;
    padding:15px 18px; font-weight:800; font-size:15px; letter-spacing:-.01em;
  }
  details.sec > summary::-webkit-details-marker{display:none;}
  details.sec > summary .num{
    width:24px; height:24px; border-radius:50%; flex:none;
    display:inline-flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:800; background:var(--ink); color:var(--bg);
  }
  details.sec > summary .chev{margin-left:auto; transition:transform .2s; color:var(--muted);}
  details.sec[open] > summary .chev{transform:rotate(180deg);}
  .sec-body{padding:0 18px 18px;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border-radius:12px; border:1px solid var(--line); background:var(--surface-2);
    padding:10px 14px; font-weight:600; cursor:pointer; font-size:14px;
    transition:background .15s, border-color .15s, transform .05s;
  }
  .btn:hover{border-color:var(--ink);}
  .btn:active{transform:translateY(1px);}
  .btn svg{width:18px; height:18px; flex:none;}
  .btn.primary{background:var(--red); color:var(--on-red); border-color:var(--red);}
  .btn.primary:hover{background:var(--red-hover); border-color:var(--red-hover);}
  .btn.dark{background:var(--ink); color:var(--bg); border-color:var(--ink);}
  .btn:disabled{opacity:.45; cursor:not-allowed; transform:none;}
  .btn[aria-pressed="true"]{background:var(--surface); border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink);}
  .btn .tick{display:none; width:16px; height:16px; border-radius:50%; background:var(--ink); color:var(--bg); align-items:center; justify-content:center; flex:none;}
  .btn .tick svg{width:11px; height:11px;}
  .btn[aria-pressed="true"] .tick{display:inline-flex;}
  .btn[aria-pressed="true"] .spark{display:none;}
  .btn.block{width:100%;}
  .btn.sm{padding:7px 10px; font-size:13px; border-radius:10px;}
  .btn-row{display:flex; gap:8px; flex-wrap:wrap;}
  .btn-row .btn{flex:1;}

  .field{margin-top:14px;}
  .field:first-child{margin-top:0;}
  .flabel{
    display:flex; justify-content:space-between; align-items:baseline; gap:8px;
    font-size:13px; font-weight:600; margin-bottom:6px;
  }
  .flabel .val{
    color:var(--muted); font-variant-numeric:tabular-nums; font-weight:600;
    background:none; border:0; padding:0; cursor:pointer;
  }
  .flabel .val.changed{color:var(--red);}
  .flabel .val .rst{display:none; color:var(--muted); font-weight:500; font-size:11.5px; margin-right:6px;}
  .flabel .val.changed .rst{display:inline;}
  .help{font-size:12.5px; color:var(--muted); margin:6px 0 0; line-height:1.45;}

  input[type=range]{
    -webkit-appearance:none; appearance:none; width:100%; height:28px; background:transparent; margin:0; cursor:pointer; touch-action:pan-y;
  }
  input[type=range]::-webkit-slider-runnable-track{height:4px; border-radius:4px; background:var(--line);}
  input[type=range]::-moz-range-track{height:4px; border-radius:4px; background:var(--line);}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:20px; height:20px; border-radius:50%;
    background:var(--surface); border:3px solid var(--ink); margin-top:-8px;
  }
  input[type=range]::-moz-range-thumb{width:14px; height:14px; border-radius:50%; background:var(--surface); border:3px solid var(--ink);}

  .seg{display:flex; background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:3px; gap:3px;}
  .seg button{flex:1; border:0; background:transparent; padding:8px 6px; border-radius:9px; font-size:13px; font-weight:600; cursor:pointer; color:var(--muted); white-space:nowrap;}
  .seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(18,28,38,.15);}
  .seg button:disabled{opacity:.4; cursor:not-allowed;}

  .chips{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{
    border:1px solid var(--line); background:var(--surface-2); border-radius:999px;
    padding:7px 12px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .chip[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink);}

  .formats{display:grid; grid-template-columns:repeat(3,1fr); gap:6px;}
  .fmt{
    border:1px solid var(--line); background:var(--surface-2); border-radius:12px; cursor:pointer;
    padding:10px 6px 8px; display:flex; flex-direction:column; align-items:center; gap:6px; font-size:12px; font-weight:600; text-align:center; line-height:1.15;
  }
  .fmt .shape{background:#fff; outline:1px solid rgba(18,28,38,.25); position:relative; border-radius:1px;}
  .fmt .shape i{position:absolute; background:var(--blue); opacity:.75;}
  .fmt[aria-pressed="true"]{border-color:var(--ink); background:var(--surface); box-shadow:inset 0 0 0 1px var(--ink);}
  .fmt small{font-weight:400; color:var(--muted); font-size:11px;}

  .swatches{display:flex; gap:8px; flex-wrap:wrap;}
  .swatch{width:34px; height:34px; border-radius:50%; border:1px solid rgba(18,28,38,.25); cursor:pointer; padding:0; position:relative;}
  .swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--ink);}
  .flabel .sel-name{color:var(--muted); font-weight:600;}
  .qitem .star{color:var(--line);}
  .qitem .star[aria-pressed="true"]{color:var(--gold);}

  .dl-group{border-top:1px dashed var(--line); background:var(--surface); gap:12px;}
  .actions:has(+ .dl-group){border-radius:0;}
  .act-head{display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:700;}
  .act-head svg{width:17px; height:17px; flex:none; color:var(--muted);}
  .dl-opts{display:flex; gap:8px; align-items:stretch;}
  .dl-opts .seg{flex:2;}
  .dl-opts button{display:flex; align-items:center; justify-content:center; gap:7px;}
  .ci{position:relative; flex:none; width:14px; height:18px; border:2px solid currentColor;}
  .ci.r{border-radius:4px;}
  .ci i{position:absolute; left:2px; right:2px; top:2px; bottom:5px; background:currentColor; opacity:.35; border-radius:1px;}
  .ci.edge{border-color:#111; background:#fff;}
  .ci.edge i{background:#111;}
  .edge-btn{flex:1; border:1px solid var(--line); background:var(--surface-2); border-radius:12px; padding:6px 10px; font-size:13px; font-weight:600; cursor:pointer; color:var(--muted); white-space:nowrap;}
  .edge-btn[aria-pressed="true"]{border-color:var(--ink); color:var(--ink); background:var(--surface); box-shadow:inset 0 0 0 1px var(--ink);}
  .check{display:flex; align-items:flex-start; gap:10px; font-size:13.5px; cursor:pointer; margin-top:12px;}
  .check input{width:18px; height:18px; margin:1px 0 0; accent-color:var(--red); flex:none;}

  input[type=text], input[type=number], select{
    width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:10px;
    padding:9px 11px; font-size:14px;
  }
  input[type=text]:focus, input[type=number]:focus, select:focus{outline:none; border-color:var(--ink);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  .stepper{display:inline-flex; align-items:center; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--surface-2);}
  .stepper button{border:0; background:transparent; width:34px; height:34px; cursor:pointer; font-size:18px; font-weight:600;}
  .stepper span{min-width:28px; text-align:center; font-variant-numeric:tabular-nums; font-weight:700;}

  .actions{padding:16px 18px 18px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:10px; background:var(--surface-2); border-radius:0 0 var(--radius) var(--radius);}
  .actions .row{display:flex; align-items:center; gap:10px; justify-content:space-between; font-size:13.5px; font-weight:600;}

  /* ---------- Print view ---------- */
  .print{display:grid; grid-template-columns:380px minmax(0,1fr); gap:20px; align-items:start;}
  .queue{display:flex; flex-direction:column; gap:8px;}
  .qitem{display:flex; align-items:center; gap:10px; padding:8px; border:1px solid var(--line); border-radius:12px; background:var(--surface-2);}
  .qitem img{width:44px; height:56px; object-fit:contain; flex:none; filter:drop-shadow(0 1px 2px rgba(0,0,0,.25));}
  .qitem .meta{flex:1; min-width:0; font-size:13px;}
  .qitem .meta b{display:block; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer;}
  .qitem .meta b.open{white-space:normal; overflow-wrap:anywhere;}
  @media (hover: hover){ .qitem .meta b:hover{white-space:normal; overflow-wrap:anywhere;} }
  .qitem .meta span{color:var(--muted); font-size:12px;}
  .icon-btn{border:0; background:transparent; width:34px; height:34px; border-radius:8px; cursor:pointer; color:var(--muted); display:inline-flex; align-items:center; justify-content:center;}
  .icon-btn:hover{background:var(--line); color:var(--ink);}
  .icon-btn svg{width:18px; height:18px;}
  .queue-empty{color:var(--muted); font-size:13.5px; padding:14px; border:1px dashed var(--line); border-radius:12px; text-align:center;}

  .sheet-area{padding:18px;}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px;}
  .sheet-head h2{margin:0; font-size:20px; font-weight:800; letter-spacing:-.01em;}
  .sheet-head p{margin:2px 0 0; color:var(--muted); font-size:13.5px;}
  .pages{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:22px;}
  .page{display:flex; flex-direction:column; align-items:center; gap:8px;}
  .page canvas{width:100%; height:auto; background:#fff; box-shadow:var(--card-shadow); border-radius:2px;}
  .page .pmeta{display:flex; align-items:center; justify-content:space-between; width:100%; font-size:12.5px; color:var(--muted); font-weight:600;}
  .warn{background:color-mix(in srgb, var(--gold) 18%, transparent); border:1px solid color-mix(in srgb, var(--gold) 50%, transparent); border-radius:10px; padding:9px 12px; font-size:13px; margin-top:12px;}

  footer{max-width:1400px; margin:0 auto; padding:10px 20px 30px; color:var(--muted); font-size:12.5px; display:flex; gap:8px; align-items:center;}
  footer svg{width:15px; height:15px; flex:none;}
  footer .ver{margin-left:auto; white-space:nowrap; font-variant-numeric:tabular-nums;}

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translate(-50%, 20px);
    background:var(--ink); color:var(--bg); padding:11px 16px; border-radius:12px; font-size:14px; font-weight:600;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:50; max-width:calc(100vw - 32px); text-align:center;
  }
  .toast.show{opacity:1; transform:translate(-50%,0);}
  .busy{position:fixed; inset:0; background:rgba(15,21,28,.35); display:none; align-items:center; justify-content:center; z-index:60;}
  .busy.show{display:flex;}
  .busy div{background:var(--surface); padding:14px 20px; border-radius:12px; font-weight:700; box-shadow:var(--shadow);}

  #printArea{display:none;}

  /* ---------- Responsive ---------- */
  @media (max-width: 1080px){
    .studio{grid-template-columns:minmax(0,1fr) 340px;}
    .print{grid-template-columns:330px minmax(0,1fr);}
  }
  @media (max-width: 820px){
    body{padding-bottom:calc(76px + env(safe-area-inset-bottom));}
    .top{padding:10px 16px; gap:10px;}
    .brand img{height:44px;}
    .brand h1{font-size:21px;}
    .brand p{font-size:11.5px; line-height:1.25; margin-top:3px;}
    .tabs{
      position:fixed; left:12px; right:12px; bottom:calc(10px + env(safe-area-inset-bottom)); z-index:40;
      justify-content:stretch; box-shadow:0 8px 30px rgba(0,0,0,.25);
    }
    .tab{flex:1; justify-content:center; padding:11px 10px;}
    main{padding:0 12px 24px;}
    .studio, .print{grid-template-columns:minmax(0,1fr); gap:14px;}
    .studio > *, .print > *{min-width:0;}
    .stage-wrap{position:sticky; top:0; z-index:5; margin:0 -12px; padding:0 12px 6px; background:var(--bg);}
    .stage{height:46vh; min-height:300px; border-radius:14px;}
    .stage:not(.has-photo){height:auto; min-height:340px;}
    .hint{font-size:11px; padding:5px 10px; line-height:1.4; border-radius:11px; white-space:pre-line; min-width:0;}
    .hint svg{width:12px; height:12px;}
    #compareBtn{padding:9px;}
    #compareBtn span{display:none;}
    #compareBtn svg{width:18px; height:18px;}
    footer{padding:6px 16px 20px;}
    .toast{bottom:calc(90px + env(safe-area-inset-bottom));}
  }
  @media (max-width: 420px){
    .lang button{width:34px; height:26px;}
    .brand h1{font-size:19px;}
    .brand{gap:9px;}
    .brand p{font-size:11px;}
    .formats{grid-template-columns:repeat(3,1fr);}
  }

  @media print{
    body{background:#fff; padding:0;}
    body > *:not(#printArea){display:none !important;}
    #printArea{display:block;}
    #printArea .sheet{page-break-after:always; break-after:page; overflow:hidden;}
    #printArea .sheet:last-child{page-break-after:auto; break-after:auto;}
    #printArea img{display:block;}
  }
</style>
<style id="pageSize"></style>

  <section class="view studio" id="viewStudio">

      <div class="stage photo-mode" id="stage">

          <div class="drop-ill"><div></div></div>
          <h2 data-i18n="emptyTitle"></h2>
          <p data-i18n="emptyText"></p>
          <button class="btn primary" id="pickBtn2">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>
            <span data-i18n="pickPhoto"></span>
          </button>

          <span class="hint hint-photo" data-i18n="photoHint"></span>
          <span class="hint hint-card" data-i18n="panHint"></span>

      <details class="sec" open>
        <summary><span class="num">1</span><span data-i18n="secPhoto"></span><svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg></summary>
        <div class="sec-body">
          <button class="btn block" id="pickBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 8"/></svg>
            <span data-i18n="pickPhoto"></span>
          </button>

            <div class="flabel"><span data-i18n="rotate"></span></div>
            <div class="btn-row">

              </button>

  const top = document.querySelector('.top');
  const sync = () => document.documentElement.style.setProperty('--hdr', top.offsetHeight + 'px');
  new ResizeObserver(sync).observe(top); top.addEventListener('transitionend', sync); sync();
  addEventListener('scroll', () => top.classList.toggle('scrolled', scrollY > 24), {passive:true});
})();
function applyLang(l){
  lang = I18N[l] ? l : 'tr';

  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });

const sliderEls = {};
function makeSlider(host){
  const key = host.dataset.slider, [min, max, step, def, unit] = SLIDERS[key];
  host.innerHTML = `<div class="flabel"><span data-i18n="${key}">${t(key)}</span><button type="button" class="val" title="reset"></button></div>
    <input type="range" min="${min}" max="${max}" step="${step}" value="${def}" aria-label="${key}">`;
  const input = host.querySelector('input'), val = host.querySelector('.val');
  const fmt = v => (key === 'angle' ? (+v).toFixed(1) : (step < 1 ? (+v).toFixed(1) : v)) + unit;
  val.innerHTML = `<span class="rst" data-i18n="${TOUCH ? 'tapReset' : 'clickReset'}">${t(TOUCH ? 'tapReset' : 'clickReset')}</span><span class="num"></span>`;
  const num = val.querySelector('.num');
  const o = {input, val, def, set(v){ input.value = v; num.textContent = fmt(input.value); val.classList.toggle('changed', +input.value !== +o.def); }, get(){ return +input.value; }};
  input.addEventListener('input', () => { o.set(input.value); onSlider(key, +input.value, true); });
  input.addEventListener('change', () => onSlider(key, +input.value, false));
  val.addEventListener('click', () => { o.set(o.def); onSlider(key, o.def, false); });
  o.set(def);
  sliderEls[key] = o;
}

/* ---------- touch guard for sliders ----------
   Scrolling the panel with a finger kept catching sliders. On touch, a slider
   ignores taps and vertical swipes and only moves once the finger clearly goes
   sideways; the drag is then relative, so the value never jumps to the finger. */
let slideGuard = null;
document.addEventListener('touchstart', e => {
  const r = e.target.closest ? e.target.closest('input[type=range]') : null;
  if (!r || e.touches.length !== 1){ slideGuard = null; return; }
  const p = e.touches[0];
  slideGuard = {r, x:p.clientX, y:p.clientY, v:+r.value, cur:+r.value, mode:0};
}, {capture:true, passive:true});
document.addEventListener('touchmove', e => {
  const s = slideGuard; if (!s || s.done) return;
  const p = e.touches[0], dx = p.clientX - s.x, dy = p.clientY - s.y;
  if (!s.mode){
    if (Math.abs(dy) > 8 && Math.abs(dy) > Math.abs(dx)) s.mode = 2;
    else if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.5){ s.mode = 1; s.x = p.clientX; }
  }
  if (s.mode !== 1) return;
  if (e.cancelable) e.preventDefault();
  const r = s.r, min = +r.min, max = +r.max, step = +r.step || 1;
  const raw = s.v + (p.clientX - s.x) / r.getBoundingClientRect().width * (max - min);
  const v = clamp(+(min + Math.round((raw - min) / step) * step).toFixed(4), min, max);
  if (v !== s.cur){ s.cur = v; s.own = true; r.value = v; r.dispatchEvent(new Event('input', {bubbles:true})); s.own = false; }
}, {capture:true, passive:false});
['input', 'change'].forEach(type => document.addEventListener(type, e => {
  const s = slideGuard;
  if (!s || e.target !== s.r || s.own) return;
  e.stopImmediatePropagation();
  s.r.value = s.cur;
}, true));
function endSlideGuard(){
  const s = slideGuard; if (!s || s.done) return;
  s.done = true; s.r.value = s.cur;
  if (s.mode === 1){ s.own = true; s.r.dispatchEvent(new Event('change', {bubbles:true})); s.own = false; }
  setTimeout(() => { if (slideGuard === s) slideGuard = null; }, 120);   // swallow the browser's late change event
}
document.addEventListener('touchend', endSlideGuard, true);
document.addEventListener('touchcancel', endSlideGuard, true);

function onSlider(key, v, live){
  if (key === 'angle'){ st.angle = v; buildPrepared(); toView('photo'); }
  else if (key === 'trim'){ st.trim = v; buildPrepared(); toView('photo'); }
  else if (key === 'zoom'){ st.zoom = v / 100; toView('card'); }
  else if (key === 'frameShadow'){ st.frameShadow = v; toView('card'); }
  else if (FILM_KEYS.includes(key)){
    st.film[key] = v; toView('card');
    if (st.preset !== 'custom' && PRESETS[st.preset][key] !== v){ st.film.basePreset = st.preset; st.preset = 'custom'; buildPresets(); }
  }
  else if (key === 'printComp'){ st.printComp = v; if (!st.previewComp) return; toView('card'); }
  else if (key === 'sharpen'){ st.sharpen = v; toView('card'); }
  else if (['margin','gap','scale'].includes(key)){ ps[key] = v; savePrint(); refreshSheets(); return; }
  requestRender(live);
}

    } else {

      const W = cw * sc, H = ch * sc, ix = (cw - iw) / 2 * sc, iy = f.top * sc;
      shape = `<span class="shape" style="width:${W}px;height:${H}px"><i style="left:${ix}px;top:${iy}px;width:${iw*sc}px;height:${ih*sc}px"></i></span>`;

}
function updateFormatInfo(){
  const G = cardGeometry(), r = v => (Math.round(v * 10) / 10).toString().replace(/\.0$/, '');

/* =========================================================
   Loading
   ========================================================= */
const MAX_SRC = 4000;
async function loadFile(file){
  if (!file || !(file.type.startsWith('image/') || /\.(jpe?g|png|webp|gif|bmp|avif|heic)$/i.test(file.name))) return;
  showBusy(true);
  try{
    let bmp;
    try{ bmp = await createImageBitmap(file, {imageOrientation:'from-image'}); }
    catch(e){
      bmp = await new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = URL.createObjectURL(file); });
    }
    const w = bmp.width, h = bmp.height, s = Math.min(1, MAX_SRC / Math.max(w, h));
    const c = mk(w * s, h * s), g = c.getContext('2d');
    g.imageSmoothingQuality = 'high';
    g.drawImage(bmp, 0, 0, c.width, c.height);
    if (bmp.close) bmp.close();
    st.src = c; st.rot90 = 0; st.trim = 0; sliderEls.trim.set(0);
    const ps_ = Math.min(1, 1600 / Math.max(c.width, c.height)), pv = mk(c.width * ps_, c.height * ps_), pg = pv.getContext('2d');
    pg.imageSmoothingQuality = 'high'; pg.drawImage(c, 0, 0, pv.width, pv.height); st.srcPreview = pv;
    toView('photo');
    st.zoom = 1; sliderEls.zoom.set(100); st.panX = st.panY = .5;
    runAutoFix(true);
    stage.classList.add('has-photo');
    $('emptyState').style.display = 'none';
    canvas.style.display = 'block';
    document.querySelectorAll('[data-needs-photo]').forEach(b => b.disabled = false);
    await document.fonts.ready;
    render(false, true);
  }catch(e){
    console.error(e); toast(t('loadErr'));
  }finally{ showBusy(false); }
}
function fullBase(){ return {cx:st.src.width / 2, cy:st.src.height / 2, w:st.src.width, h:st.src.height, theta0:0}; }

function runAutoFix(quietIfNone){
  const r = detectFrame(st.src);
  if (r){
    st.base = r; st.angle = Math.round(r.theta0 * 10) / 10;
    toast(t('detected', {a:(r.theta0 >= 0 ? '+' : '') + r.theta0.toFixed(1)}));
  } else {
    st.base = fullBase(); st.angle = 0;
    if (!quietIfNone) toast(t('notDetected'));
  }
  setAutoOn(!!r);
  sliderEls.angle.def = st.angle; sliderEls.angle.set(st.angle);
  buildPrepared();
}

/* =========================================================
   Border + skew detection for scanned prints
   ========================================================= */
function detectFrame(src){
  const sc = Math.min(1, 900 / Math.max(src.width, src.height));
  const w = Math.round(src.width * sc), h = Math.round(src.height * sc);
  const c = mk(w, h), g = ctx2d(c); g.drawImage(src, 0, 0, w, h);
  const d = g.getImageData(0, 0, w, h).data;
  const lum = new Float32Array(w * h), chr = new Float32Array(w * h);
  for (let i = 0, p = 0; i < w * h; i++, p += 4){
    const r = d[p], gg = d[p + 1], b = d[p + 2];
    lum[i] = .299 * r + .587 * gg + .114 * b;
    chr[i] = Math.max(r, gg, b) - Math.min(r, gg, b);
  }
  // background estimate from a band just inside the edges (skips scanner-lid lines at the very edge)
  const m = Math.min(w, h), b0 = Math.max(1, Math.round(m * .008)), b1 = Math.max(b0 + 3, Math.round(m * .03));
  const samp = [];
  for (let y = b0; y < b1; y++) for (let x = 0; x < w; x += 3){ samp.push(lum[y * w + x], lum[(h - 1 - y) * w + x]); }
  for (let x = b0; x < b1; x++) for (let y = 0; y < h; y += 3){ samp.push(lum[y * w + x], lum[y * w + (w - 1 - x)]); }
  samp.sort((a, b) => a - b);
  const bgL = samp[Math.floor(samp.length * .6)];
  if (bgL < 200) return null;
  const thr = bgL - 30;
  const isBg = i => lum[i] > thr && chr[i] < 45;
  const run = Math.max(5, Math.round(m * .012));
  function scan(len, idx){
    let cnt = 0;
    for (let k = 0; k < len * .35; k++){
      if (!isBg(idx(k))){ if (++cnt >= run) return k - run + 1; } else cnt = 0;
    }
    return -1;
  }
  const Lp = [], Rp = [], Tp = [], Bp = [];
  for (let y = Math.round(h * .1); y < h * .9; y++){
    const a = scan(w, k => y * w + k); if (a >= 0) Lp.push([y, a]);
    const b = scan(w, k => y * w + (w - 1 - k)); if (b >= 0) Rp.push([y, w - 1 - b]);
  }
  for (let x = Math.round(w * .1); x < w * .9; x++){
    const a = scan(h, k => k * w + x); if (a >= 0) Tp.push([x, a]);
    const b = scan(h, k => (h - 1 - k) * w + x); if (b >= 0) Bp.push([x, h - 1 - b]);
  }
  function fit(pts){
    if (pts.length < 20) return null;
    let use = pts, mm = 0, cc = 0;
    for (let it = 0; it < 4; it++){
      let su = 0, sv = 0, suu = 0, suv = 0; const n = use.length;
      for (const [u, v] of use){ su += u; sv += v; suu += u * u; suv += u * v; }
      const den = n * suu - su * su; if (!den) return null;
      mm = (n * suv - su * sv) / den; cc = (sv - mm * su) / n;
      const res = use.map(([u, v]) => Math.abs(v - (mm * u + cc))).sort((a, b) => a - b);
      const tol = Math.max(1.2, 2.5 * res[res.length >> 1]);
      use = pts.filter(([u, v]) => Math.abs(v - (mm * u + cc)) <= tol);
      if (use.length < 10) return null;
    }
    const pos = use.map(p => p[1]).sort((a, b) => a - b);
    return {m:mm, n:use.length, frac:use.length / pts.length, pts:use, med:pos[pos.length >> 1]};
  }
  const sides = [];
  const fl = fit(Lp), fr = fit(Rp), ft = fit(Tp), fb = fit(Bp);
  if (fl && fl.frac > .5 && fl.med > 1.5) sides.push({a:-Math.atan(fl.m), n:fl.n});
  if (fr && fr.frac > .5 && fr.med < w - 2.5) sides.push({a:-Math.atan(fr.m), n:fr.n});
  if (ft && ft.frac > .5 && ft.med > 1.5) sides.push({a:Math.atan(ft.m), n:ft.n});
  if (fb && fb.frac > .5 && fb.med < h - 2.5) sides.push({a:Math.atan(fb.m), n:fb.n});
  if (!sides.length) return null;
  // median-ish: weighted mean of side angles that agree with the median
  const sorted = sides.map(s => s.a).sort((a, b) => a - b), med = sorted[sorted.length >> 1];
  let sa = 0, sn = 0;
  for (const s of sides) if (Math.abs(s.a - med) < 0.02){ sa += s.a * s.n; sn += s.n; }
  const a = sa / sn;
  if (Math.abs(a) > 15 * Math.PI / 180) return null;
  // bounds in straightened space (rotate points by -a around image centre)
  const cx = w / 2, cy = h / 2, ca = Math.cos(a), sa_ = Math.sin(a);
  const rot = (x, y) => [(x - cx) * ca + (y - cy) * sa_, -(x - cx) * sa_ + (y - cy) * ca];
  const pct = (arr, q) => { if (!arr.length) return null; arr.sort((p, q2) => p - q2); return arr[Math.min(arr.length - 1, Math.floor(arr.length * q))]; };
  const okL = fl && fl.med > 1.5, okR = fr && fr.med < w - 2.5, okT = ft && ft.med > 1.5, okB = fb && fb.med < h - 2.5;
  let l = okL ? pct(fl.pts.map(([y, x]) => rot(x, y)[0]), .9) : -w / 2;
  let r = okR ? pct(fr.pts.map(([y, x]) => rot(x, y)[0]), .1) : w / 2;
  let tp = okT ? pct(ft.pts.map(([x, y]) => rot(x, y)[1]), .9) : -h / 2;
  let bt = okB ? pct(fb.pts.map(([x, y]) => rot(x, y)[1]), .1) : h / 2;
  const inset = m * .004 + 1;
  l += inset; r -= inset; tp += inset; bt -= inset;
  if (r - l < w * .3 || bt - tp < h * .3) return null;
  const ux = (l + r) / 2, uy = (tp + bt) / 2;
  const px = ux * ca - uy * sa_ + cx, py = ux * sa_ + uy * ca + cy;
  return {cx:px / sc, cy:py / sc, w:(r - l) / sc, h:(bt - tp) / sc, theta0:-a * 180 / Math.PI};
}

/* =========================================================
   Prepared (straightened + cropped + quarter-turned) image
   ========================================================= */
function buildPrepared(){
  if (!st.src) return;
  const b = st.base || fullBase();
  const theta = st.angle * Math.PI / 180, delta = (st.angle - b.theta0) * Math.PI / 180;
  const c = Math.abs(Math.cos(delta)), s = Math.abs(Math.sin(delta));
  const fit = Math.min(b.w / (b.w * c + b.h * s), b.h / (b.w * s + b.h * c));
  const tr = 1 - 2 * st.trim / 100;
  const w = Math.max(16, Math.round(b.w * fit * tr)), h = Math.max(16, Math.round(b.h * fit * tr));
  const k = ((st.rot90 % 4) + 4) % 4;
  const W = k % 2 ? h : w, H = k % 2 ? w : h;
  const cv = mk(W, H), g = cv.getContext('2d');
  g.imageSmoothingQuality = 'high';
  g.translate(W / 2, H / 2); g.rotate(k * Math.PI / 2 + theta);
  g.drawImage(st.src, -b.cx, -b.cy);
  st.prep = cv; st.mips = [cv];
  updateFormatInfo();
}
function mipFor(scale){
  let i = 0, s = 1;
  while (s * .5 >= scale && st.mips[i].width > 64){
    if (!st.mips[i + 1]){
      const p = st.mips[i], n = mk(p.width / 2, p.height / 2), g = n.getContext('2d');
      g.imageSmoothingQuality = 'high'; g.drawImage(p, 0, 0, n.width, n.height); st.mips[i + 1] = n;
    }
    i++; s *= .5;
  }

}

/* =========================================================
   Card geometry (mm)
   ========================================================= */
function prepAspect(){ return st.prep ? st.prep.width / st.prep.height : 3 / 4; }
function cardGeometry(){
  const f = FORMATS[st.format];
  let cw, ch, ix, iy, iw, ih;
  if (st.format === 'original'){
    const a = prepAspect(), L = 72;
    iw = a >= 1 ? L : L * a; ih = a >= 1 ? L / a : L;
    ix = 5; iy = 5; cw = iw + 10; ch = ih + 22;
    return {cw, ch, ix, iy, iw, ih, rotated:false};
  }
  [cw, ch] = f.card; [iw, ih] = f.img; ix = (cw - iw) / 2; iy = f.top;
  const nativeLand = iw > ih * 1.05, nativePort = ih > iw * 1.05;
  let want = st.orient;
  if (want === 'auto') want = prepAspect() >= 1 ? 'land' : 'port';
  if ((nativePort && want === 'land') || (nativeLand && want === 'port')){
    // turn the card 90° counter-clockwise: the thick strip ends up on the right
    return {cw:ch, ch:cw, ix:iy, iy:cw - (ix + iw), iw:ih, ih:iw, rotated:true};
  }

/* =========================================================
   Pixel pipeline
   ========================================================= */
function blurH(s, d, w, h, r){
  const k = 1 / (2 * r + 1);

    const o = y * w; let acc = 0;
    for (let i = -r; i <= r; i++) acc += s[o + clamp(i, 0, w - 1)];
    for (let x = 0; x < w; x++){
      d[o + x] = acc * k;
      acc += s[o + Math.min(w - 1, x + r + 1)] - s[o + Math.max(0, x - r)];
    }
  }
}
function blurV(s, d, w, h, r){
  const k = 1 / (2 * r + 1);
  for (let x = 0; x < w; x++){
    let acc = 0;
    for (let i = -r; i <= r; i++) acc += s[clamp(i, 0, h - 1) * w + x];
    for (let y = 0; y < h; y++){
      d[y * w + x] = acc * k;
      acc += s[Math.min(h - 1, y + r + 1) * w + x] - s[Math.max(0, y - r) * w + x];
    }

}
// ~gaussian blur via 3 box passes, in place

  const tmp = new Float32Array(buf.length);
  for (let p = 0; p < 3; p++){ blurH(buf, tmp, w, h, r); blurV(tmp, buf, w, h, r); }
  return buf;
}
function hash2(x, y){
  let n = Math.imul(x, 374761393) + Math.imul(y, 668265263) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);

}
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

function processPixels(img, P, k){
  const {data, width:w, height:h} = img, n = w * h;
  const R = new Float32Array(n), G = new Float32Array(n), B = new Float32Array(n);

  // --- 1. auto levels + partial grey-world white balance
  let lo = 0, hi = 255, gR = 1, gG = 1, gB = 1;
  if (P.auto){
    const hist = new Uint32Array(256); let mr = 0, mg = 0, mb = 0, cnt = 0;
    for (let p = 0; p < data.length; p += 8){
      const r = data[p], g = data[p + 1], b = data[p + 2];
      hist[(.299 * r + .587 * g + .114 * b) | 0]++;
      mr += r; mg += g; mb += b; cnt++;

    const cut = cnt * .003; let c = 0;
    for (lo = 0; lo < 255; lo++){ c += hist[lo]; if (c > cut) break; }
    c = 0;
    for (hi = 255; hi > 0; hi--){ c += hist[hi]; if (c > cut) break; }
    lo = Math.min(lo, 40); hi = Math.max(hi, 190);
    mr /= cnt; mg /= cnt; mb /= cnt; const mean = (mr + mg + mb) / 3;
    gR = clamp(1 + (mean / (mr || 1) - 1) * .5, .9, 1.1);
    gG = clamp(1 + (mean / (mg || 1) - 1) * .5, .9, 1.1);
    gB = clamp(1 + (mean / (mb || 1) - 1) * .5, .9, 1.1);
  }

  // --- 2. tone LUT (levels, white balance, warmth/tint, exposure + shoulder, contrast, fade)
  const ev = P.exposure / 100, con = P.contrast / 100, wm = P.warmth / 100, tn = P.tint / 100, fade = P.fade / 100 * .2;
  const chMul = [gR * (1 + .09 * wm + .03 * tn), gG * (1 + .015 * wm - .06 * tn), gB * (1 - .12 * wm + .03 * tn)];
  const lut1 = [new Float32Array(256), new Float32Array(256), new Float32Array(256)];
  const expo = Math.pow(2, ev), shoulderTop = Math.tanh((expo - .8) / .2);
  for (let ch = 0; ch < 3; ch++){
    for (let v = 0; v < 256; v++){
      let x = (v * chMul[ch] - lo) / (hi - lo);
      x = Math.max(0, x) * expo;
      if (expo > 1 && x > .8) x = .8 + .2 * Math.tanh((x - .8) / .2) / shoulderTop;   // soft shoulder, only when pushed past white
      if (con >= 0){ const sm = x * x * (3 - 2 * x); x += (sm - x) * con * .9; }
      else x += (.5 - x) * (-con) * .45;
      x = fade + x * (1 - fade);
      lut1[ch][v] = clamp(x, 0, 1);
    }
  }
  // --- 3. film split-tone curves (after saturation so mono/sepia keep their tone)
  const lut2 = [new Float32Array(1024), new Float32Array(1024), new Float32Array(1024)];
  for (let ch = 0; ch < 3; ch++){
    for (let i = 0; i < 1024; i++){
      const x = i / 1023;
      let y = x + P.sh[ch] * Math.pow(1 - x, 1.5) + P.hi[ch] * x * x;
      y *= 1 - P.white;
      lut2[ch][i] = clamp(y, 0, 1);
    }
  }
  const sat = 1 + P.saturation / 100;
  for (let i = 0, p = 0; i < n; i++, p += 4){
    let r = lut1[0][data[p]], g = lut1[1][data[p + 1]], b = lut1[2][data[p + 2]];
    const y = .299 * r + .587 * g + .114 * b;
    r = clamp(y + (r - y) * sat, 0, 1); g = clamp(y + (g - y) * sat, 0, 1); b = clamp(y + (b - y) * sat, 0, 1);
    R[i] = lut2[0][(r * 1023) | 0]; G[i] = lut2[1][(g * 1023) | 0]; B[i] = lut2[2][(b * 1023) | 0];
  }

  // --- 4. lens softness (mix with a small blur)
  if (P.softness > 0){
    const rad = Math.max(1, k * .12), amt = P.softness / 100 * .75;
    for (const C of [R, G, B]){
      const bl = blur(C.slice(), w, h, rad);
      for (let i = 0; i < n; i++) C[i] += (bl[i] - C[i]) * amt;
    }
  }

  // --- 5. halation: blurred highlights screened back in, tinted
  if (P.halation > 0){
    const f = Math.max(1, Math.round(Math.min(w, h) / 240)), sw = Math.ceil(w / f), sh = Math.ceil(h / f);
    const small = new Float32Array(sw * sh), cnt = new Float32Array(sw * sh);
    for (let y = 0; y < h; y++){
      const sy = (y / f) | 0;
      for (let x = 0; x < w; x++){
        const i = y * w + x, Y = .299 * R[i] + .587 * G[i] + .114 * B[i];
        const si = sy * sw + ((x / f) | 0);
        small[si] += Math.max(0, Y - .72) / .28; cnt[si]++;
      }
    }
    for (let i = 0; i < small.length; i++) small[i] /= cnt[i] || 1;
    blur(small, sw, sh, Math.max(1, Math.min(sw, sh) * .03));
    const amt = P.halation / 100 * .45, [tr, tg, tb] = P.glow;
    for (let y = 0; y < h; y++){
      const fy = clamp(y / f - .5, 0, sh - 1), y0 = fy | 0, y1 = Math.min(sh - 1, y0 + 1), wy = fy - y0;
      for (let x = 0; x < w; x++){
        const fx = clamp(x / f - .5, 0, sw - 1), x0 = fx | 0, x1 = Math.min(sw - 1, x0 + 1), wx = fx - x0;
        const v = (small[y0 * sw + x0] * (1 - wx) + small[y0 * sw + x1] * wx) * (1 - wy) + (small[y1 * sw + x0] * (1 - wx) + small[y1 * sw + x1] * wx) * wy;
        const a = v * amt, i = y * w + x;
        R[i] = 1 - (1 - R[i]) * (1 - a * tr); G[i] = 1 - (1 - G[i]) * (1 - a * tg); B[i] = 1 - (1 - B[i]) * (1 - a * tb);
      }
    }
  }

  // --- 6. flash vignette
  if (P.vignette > 0){
    const amt = P.vignette / 100 * .5;
    for (let y = 0; y < h; y++){
      const v = (y / h - .5) * 2, vv = v * v;
      for (let x = 0; x < w; x++){
        const u = (x / w - .5) * 2, dd = (u * u + vv) / 2;
        const f = 1 - amt * smooth(.12, 1, dd), i = y * w + x;
        R[i] *= f; G[i] *= f; B[i] *= f;
      }
    }
  }

  // --- 7. print brightness compensation (gamma lift of midtones + slight shadow lift)
  if (P.comp > 0){
    const kk = P.comp / 100, gm = 1 / (1 + .55 * kk), lift = .02 * kk, lut = new Float32Array(1024);
    for (let i = 0; i < 1024; i++){ const x = i / 1023; lut[i] = lift + (1 - lift) * (x + (Math.pow(x, gm) - x) * (1 - x * x * .6)); }
    for (let i = 0; i < n; i++){ R[i] = lut[(clamp(R[i], 0, 1) * 1023) | 0]; G[i] = lut[(clamp(G[i], 0, 1) * 1023) | 0]; B[i] = lut[(clamp(B[i], 0, 1) * 1023) | 0]; }
  }

  // --- 8. output sharpening (luminance unsharp mask, radius ~0.1 mm)
  if (P.sharpen > 0){
    const Y = new Float32Array(n);
    for (let i = 0; i < n; i++) Y[i] = .299 * R[i] + .587 * G[i] + .114 * B[i];
    const bl = blur(Y.slice(), w, h, Math.max(1, k * .1));
    const amt = P.sharpen / 100 * 1.3;
    for (let i = 0; i < n; i++){
      let dlt = Y[i] - bl[i];
      if (Math.abs(dlt) < .006) continue;
      dlt *= amt; R[i] += dlt; G[i] += dlt; B[i] += dlt;
    }
  }

  // --- 9. grain: luminance noise, strongest in midtones, fixed physical size
  const gamt = P.grain / 100 * .1, cell = Math.max(1, k / PX_PER_MM);
  for (let y = 0, i = 0, p = 0; y < h; y++){
    const gy = (y / cell) | 0;
    for (let x = 0; x < w; x++, i++, p += 4){
      let r = R[i], g = G[i], b = B[i];
      if (gamt > 0){
        const Y = .299 * r + .587 * g + .114 * b, wgt = .35 + .65 * (1 - (2 * Y - 1) * (2 * Y - 1));

        r += nz; g += nz; b += nz;
      }
      data[p] = r * 255; data[p + 1] = g * 255; data[p + 2] = b * 255; data[p + 3] = 255;
    }
  }
  return img;
}

function pipelineParams(forPrint){
  return {
    ...PRESETS[st.preset === 'custom' ? (st.film.basePreset || 'instax') : st.preset],
    ...st.film,
    auto:st.autoLevels,
    comp:(forPrint || st.previewComp) ? st.printComp : 0,
    sharpen:st.sharpen,
  };
}

/* =========================================================
   Card rendering
   ========================================================= */
function isDarkColor(hex){ const v = parseInt(hex.slice(1), 16); return (.299 * (v >> 16) + .587 * ((v >> 8) & 255) + .114 * (v & 255)) < 128; }
// corner radius of the card (download option) and of the photo window, which on real film is
// only slightly rounded
const CORNER_MM = {mini:3, square:3, wide:3, polaroid:2, go:2, original:2.5};
const WINDOW_R = .1;
function roundRect(g, x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function renderCard(k, opts = {}){
  const G = cardGeometry();

  const cv = mk(W, H), g = cv.getContext('2d');
  g.fillStyle = st.border; g.fillRect(0, 0, W, H);
  const px = Math.round(G.ix * k), py = Math.round(G.iy * k), pw = Math.round(G.iw * k), ph = Math.round(G.ih * k);
  const pc = mk(pw, ph), pg = ctx2d(pc);

  const iw = st.prep.width, ih = st.prep.height;
  const scale = Math.max(pw / iw, ph / ih) * st.zoom, dw = iw * scale, dh = ih * scale;
  pg.imageSmoothingEnabled = true; pg.imageSmoothingQuality = 'high';
  pg.fillStyle = '#808080'; pg.fillRect(0, 0, pw, ph);
  pg.drawImage(mipFor(scale), (pw - dw) * st.panX, (ph - dh) * st.panY, dw, dh);
  if (!opts.raw){
    const id = pg.getImageData(0, 0, pw, ph);
    processPixels(id, pipelineParams(opts.print), k);
    pg.putImageData(id, 0, 0);
  }
  // the glossy print sits under the frame: a slightly rounded window, and the frame's raised lip
  // casts a soft shadow onto the photo (light from above, so the top edge is darker)
  const wr = CORNER_MM[st.format] * WINDOW_R * k;
  g.save();
  g.beginPath(); roundRect(g, px, py, pw, ph, wr); g.clip();
  g.drawImage(pc, px, py);
  g.beginPath(); g.rect(px - 10 * k, py - 10 * k, pw + 20 * k, ph + 20 * k); roundRect(g, px, py, pw, ph, wr);

    g.fillStyle = '#000';
    g.shadowColor = `rgba(0,0,0,${Math.min(1, .34 * sh)})`; g.shadowBlur = .45 * k; g.shadowOffsetY = .14 * k;
    g.fill('evenodd');
    g.shadowColor = `rgba(0,0,0,${Math.min(1, .14 * sh)})`; g.shadowBlur = 1.6 * k; g.shadowOffsetY = .3 * k;

  g.strokeStyle = isDarkColor(st.border) ? 'rgba(255,255,255,.10)' : 'rgba(0,0,0,.12)';
  g.lineWidth = Math.max(1, k * .06);

}
function rand01(seed){ const x = Math.sin(seed * 12.9898) * 43758.5453; return x - Math.floor(x); }
function drawCaption(g, G, k){
  const text = st.caption.trim(); if (!text) return;
  let cx, cy, len, thick, rot;
  if (!G.rotated){ const top = G.iy + G.ih; cx = G.cw / 2; cy = (top + G.ch) / 2; thick = G.ch - top; len = G.cw; rot = 0; }
  else { const left = G.ix + G.iw; cx = (left + G.cw) / 2; cy = G.ch / 2; thick = G.cw - left; len = G.ch; rot = -Math.PI / 2; }
  if (st.font === 'label') return drawLabel(g, text, cx, cy, len, thick, rot, k);

  const fam = marker ? "'Permanent Marker', cursive" : "Caveat, cursive";
  let size = thick * (marker ? .36 : .5) * k;
  g.save();
  g.translate(cx * k, cy * k); g.rotate(rot);

  g.fillStyle = st.ink !== 'auto' ? INKS[st.ink] : isDarkColor(st.border) ? '#ece6d6' : '#1f2a36';
  g.textBaseline = 'middle';
  let x = -total / 2;
  chars.forEach((c, i) => {
    const jy = (rand01(i * 3.7 + 1) - .5) * size * .12, jr = (rand01(i * 7.1 + 5) - .5) * .12;
    g.save(); g.translate(x + widths[i] / 2, jy); g.rotate(jr); g.fillText(c, -widths[i] / 2, 0); g.restore();
    x += widths[i];

// embossed label-maker tape (Dymo style): coloured tape, thin condensed capitals
// pressed in one by one, so spacing and baseline wander and the plastic whitens
function drawLabel(g, text, cx, cy, len, thick, rot, k){
  const tape = st.ink === 'navy' ? INKS.navy : st.ink === 'red' ? INKS.red : '#1d1f22';
  const chars = [...text.toLocaleUpperCase(lang === 'tr' ? 'tr-TR' : 'en-US')];
  let size = thick * .34 * k;
  const font = s => `400 ${s}px 'Pathway Gothic One', 'Arial Narrow', sans-serif`;
  const jit = chars.map((c, i) => ({dx:(rand01(i * 2.9 + 4) - .5) * .1, dy:(rand01(i * 5.3 + 2) - .5) * .08, a:.84 + rand01(i * 1.7 + 9) * .14, r:(rand01(i * 8.3 + 1) - .5) * .03}));
  g.save();
  g.translate(cx * k, cy * k); g.rotate(rot - .02);
  g.font = font(size);
  let track = size * .2;
  const measure = () => { const w = chars.map(c => c === ' ' ? size * .45 : g.measureText(c).width); return [w, w.reduce((a, b) => a + b, 0) + track * (chars.length - 1)]; };
  let [widths, total] = measure();
  const maxW = len * .8 * k - size * 1.4;
  if (total > maxW){ const f = maxW / total; size *= f; track *= f; g.font = font(size); [widths, total] = measure(); }
  const tw = total + size * 1.4, th = size * 1.55;
  g.shadowColor = 'rgba(0,0,0,.28)'; g.shadowBlur = size * .25; g.shadowOffsetY = size * .08;
  g.fillStyle = tape;
  g.beginPath();
  const nick = size * .14;           // the cutter leaves slightly angled ends
  g.moveTo(-tw / 2 + nick, -th / 2); g.lineTo(tw / 2, -th / 2); g.lineTo(tw / 2 - nick, th / 2); g.lineTo(-tw / 2, th / 2); g.closePath();
  g.fill();
  g.shadowColor = 'transparent';
  const sheen = g.createLinearGradient(0, -th / 2, 0, th / 2);
  sheen.addColorStop(0, 'rgba(255,255,255,.16)'); sheen.addColorStop(.45, 'rgba(255,255,255,0)'); sheen.addColorStop(1, 'rgba(0,0,0,.12)');
  g.fillStyle = sheen; g.fill();
  g.textBaseline = 'middle';
  let x = -total / 2;
  chars.forEach((c, i) => {
    const j = jit[i], ox = x + j.dx * size, oy = j.dy * size;
    g.save(); g.translate(ox + widths[i] / 2, oy); g.rotate(j.r); g.translate(-widths[i] / 2, 0);
    // stretched plastic around each letter, then the recess shadow, then the raised face
    g.fillStyle = 'rgba(255,255,255,.12)'; g.shadowColor = 'rgba(255,255,255,.35)'; g.shadowBlur = size * .12; g.fillText(c, 0, 0);
    g.shadowColor = 'transparent';
    g.fillStyle = 'rgba(0,0,0,.4)'; g.fillText(c, size * .025, size * .045);
    g.fillStyle = `rgba(250,250,247,${j.a})`; g.fillText(c, 0, 0);
    g.restore();
    x += widths[i] + track;
  });
  g.restore();
}

// thermal label printer: white paper strip with torn ends, monospaced print
// that fades in thin horizontal bands where the print head is worn
function drawThermal(g, text, cx, cy, len, thick, rot, k){
  const ink = st.ink === 'navy' ? INKS.navy : st.ink === 'red' ? INKS.red : '#18191b', paper = '#fbfbf8';
  let size = thick * .3 * k;
  const font = s => `500 ${s}px 'IBM Plex Mono', 'Courier New', monospace`;
  g.save();
  g.translate(cx * k, cy * k); g.rotate(rot + .012);
  g.font = font(size);
  let tw0 = g.measureText(text).width;
  const maxW = len * .8 * k - size * 1.6;
  if (tw0 > maxW){ size *= maxW / tw0; g.font = font(size); tw0 = g.measureText(text).width; }
  const tw = tw0 + size * 1.6, th = size * 1.9, tooth = size * .16;
  g.shadowColor = 'rgba(0,0,0,.22)'; g.shadowBlur = size * .22; g.shadowOffsetY = size * .06;
  g.fillStyle = paper;
  g.beginPath(); g.moveTo(-tw / 2, -th / 2); g.lineTo(tw / 2, -th / 2);
  const n = Math.max(4, Math.round(th / (tooth * 2.2)));
  for (let i = 1; i <= n; i++) g.lineTo(tw / 2 - (i % 2 ? tooth : 0) - rand01(i * 3.1) * tooth * .4, -th / 2 + th * i / n);
  g.lineTo(-tw / 2, th / 2);
  for (let i = n - 1; i >= 0; i--) g.lineTo(-tw / 2 + (i % 2 ? tooth : 0) + rand01(i * 4.7 + 2) * tooth * .4, -th / 2 + th * i / n);
  g.closePath(); g.fill();
  g.shadowColor = 'transparent';
  g.save(); g.clip();
  g.fillStyle = ink; g.globalAlpha = .92; g.textBaseline = 'middle';
  g.fillText(text, -tw0 / 2, size * .04);
  g.globalAlpha = 1;
  g.fillStyle = paper;
  const lines = Math.round(th / Math.max(1, size * .09));
  for (let i = 0; i < lines; i++){
    const r = rand01(i * 6.7 + 3);
    if (r < .82) continue;
    g.globalAlpha = .25 + (r - .82) * 2.5;

  const ca = Math.cos(ang), sa = Math.sin(ang), sw = st.src.width, sh = st.src.height;

    row.innerHTML = `<img alt="" src="${q.thumb}"><div class="meta"><b></b><span>${Math.round(q.w * 10) / 10} × ${Math.round(q.h * 10) / 10} mm</span></div>
      <div class="stepper"><button aria-label="-">−</button><span>${q.copies}</span><button aria-label="+">+</button></div>
      <button class="icon-btn star" title="${t('prefer')}" aria-pressed="${q.id === (fillPref ?? queue[0].id)}"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg></button>
      <button class="icon-btn del" title="${t('remove')}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>`;
    const name = row.querySelector('b');
    name.textContent = name.title = q.caption ? `“${q.caption}” — ${q.label}` : q.label;
    name.addEventListener('click', () => name.classList.toggle('open'));
    const [minus, plus] = row.querySelectorAll('.stepper button');
    minus.addEventListener('click', () => { q.copies = Math.max(1, q.copies - 1); renderQueue(); refreshSheets(); });
    plus.addEventListener('click', () => { q.copies = Math.min(99, q.copies + 1); renderQueue(); refreshSheets(); });
    row.querySelector('.star').addEventListener('click', () => { fillPref = q.id; renderQueue(); refreshSheets(); });
    row.querySelector('.del').addEventListener('click', () => { queue.splice(queue.indexOf(q), 1); if (fillPref === q.id) fillPref = null; renderQueue(); refreshSheets(); });
    host.appendChild(row);
  });
}

async function pageBlobs(indices){
  const out = [];
  for (const i of indices){
    await nextFrame();
    const cv = renderPage(layout, layout.pages[i], PX_PER_MM);
    out.push(await new Promise(r => cv.toBlob(r, 'image/jpeg', .95)));
  }
  return out;
}
function pageName(i){ return `rangers-instant-${ps.paper}-${i + 1}.jpg`; }
async function exportPages(indices){
  if (!layout) return;
  showBusy(true);
  try{
    const blobs = await pageBlobs(indices);
    for (let j = 0; j < blobs.length; j++){ downloadBlob(blobs[j], pageName(indices[j])); await sleep(350); }
  } finally { showBusy(false); }
}
$('downloadSheets').addEventListener('click', () => layout && exportPages(layout.pages.map((_, i) => i)));
$('printSheets').addEventListener('click', async () => {
  if (!layout) return;
  showBusy(true);
  try{
    const blobs = await pageBlobs(layout.pages.map((_, i) => i));
    const area = $('printArea'); area.innerHTML = '';
    $('pageSize').textContent = `@page{size:${layout.PW}mm ${layout.PH}mm; margin:0;}`;
    const loads = blobs.map(b => new Promise(res => {
      const d = document.createElement('div'); d.className = 'sheet'; d.style.width = layout.PW + 'mm'; d.style.height = layout.PH + 'mm';
      const im = new Image(); im.onload = res; im.onerror = res; im.src = URL.createObjectURL(b);
      im.style.width = layout.PW + 'mm'; im.style.height = layout.PH + 'mm';
      d.appendChild(im); area.appendChild(d);
    }));
    await Promise.all(loads);
    toast(t('printTip'));
  } finally { showBusy(false); }
  await sleep(300);
  window.print();
});
if (navigator.canShare){
  try{ if (navigator.canShare({files:[new File([new Blob(['x'], {type:'image/jpeg'})], 'a.jpg', {type:'image/jpeg'})]})) $('shareSheets').hidden = false; }catch(e){}
}
$('shareSheets').addEventListener('click', async () => {
  if (!layout) return;
  showBusy(true);
  let files;
  try{
    const idx = layout.pages.map((_, i) => i), blobs = await pageBlobs(idx);
    files = blobs.map((b, j) => new File([b], pageName(idx[j]), {type:'image/jpeg'}));
  } finally { showBusy(false); }
  try{ await navigator.share({files, title:'Rangers Instant'}); }catch(e){ /* cancelled */ }
});

// print settings wiring
$('paper').value = ps.paper;
$('customW').value = ps.customW; $('customH').value = ps.customH;
$('customSize').hidden = ps.paper !== 'custom';
$('cutGuides').value = ps.cut;
$('allowRotate').checked = ps.rotate; setSeg('fillSeg', ps.fill);
setSeg('paperOrient', ps.orient);
['margin', 'gap', 'scale'].forEach(k => sliderEls[k].set(ps[k]));
$('paper').addEventListener('change', e => { ps.paper = e.target.value; $('customSize').hidden = ps.paper !== 'custom'; savePrint(); refreshSheets(); });
$('customW').addEventListener('change', e => { ps.customW = +e.target.value; savePrint(); refreshSheets(); });
$('customH').addEventListener('change', e => { ps.customH = +e.target.value; savePrint(); refreshSheets(); });
$('cutGuides').addEventListener('change', e => { ps.cut = e.target.value; savePrint(); refreshSheets(); });
$('allowRotate').addEventListener('change', e => { ps.rotate = e.target.checked; savePrint(); refreshSheets(); });
bindSeg('fillSeg', v => { ps.fill = v; savePrint(); refreshSheets(); });
bindSeg('paperOrient', v => { ps.orient = v; savePrint(); refreshSheets(); });

/* =========================================================
   Misc helpers
   ========================================================= */
function downloadBlob(blob, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
const nextFrame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
let toastT = 0;
function toast(msg){ const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 3200); }
function showBusy(on){ $('busy').classList.toggle('show', on); }

function showView(v){
  $('viewStudio').hidden = v !== 'studio'; $('viewPrint').hidden = v !== 'print';
  $('tabStudio').setAttribute('aria-selected', v === 'studio'); $('tabPrint').setAttribute('aria-selected', v === 'print');
  if (v === 'studio') requestRender(); else refreshSheets();
  window.scrollTo({top:0});
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => showView(b.dataset.view)));
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => applyLang(b.dataset.lang)));
document.querySelectorAll('[data-needs-photo]').forEach(b => b.disabled = true);

/* ---------- init ---------- */
window.RI = {st, ps, queue, renderCard, PX_PER_MM, computeLayout};   // handy for debugging from the console
buildSwatches();
applyPreset('instax');
applyLang(recall('lang', (navigator.language || 'tr').toLowerCase().startsWith('tr') ? 'tr' : 'en'));
</script>
